# ==============================================================================
# ResQ-Allocate — Disaster Management Resource Allocation System
# Primary Spring Boot Application Configuration
# ==============================================================================

server.port=8080
spring.application.name=crisis-sync-backend

# Database Connection (XAMPP MariaDB / MySQL on localhost:3306)
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:mysql://localhost:3306/resq_allocate?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:root}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA & Hibernate Settings for MariaDB 10.4+
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MariaDBDialect
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.globally_quoted_identifiers=true

# HikariCP Connection Pool Settings
spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.minimum-idle=2
spring.datasource.hikari.idle-timeout=30000
spring.datasource.hikari.max-lifetime=1800000
spring.datasource.hikari.connection-timeout=20000

# Security & JWT Configuration (can be overridden via JWT_SECRET environment variable)
crisis.sync.jwt.secret=${JWT_SECRET:CrisisSyncSecretKeyForEmergencyOperationsCenter2026SecureJwtHmac256Key}
crisis.sync.jwt.expiration-ms=86400000

# CORS Allowed Origins
crisis.sync.cors.allowed-origins=http://127.0.0.1:5500,http://localhost:5500,http://localhost:3000,http://localhost:8080
